name: tally
description: A considered home for your subscriptions, renewals, and recurring spending.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  url_launcher: ^6.3.2
  share_plus: ^11.1.0
  cross_file: ^0.3.4+2
  file_picker: ^10.3.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  shared_preferences_platform_interface: ^2.4.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
